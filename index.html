<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบซ่อมบำรุงโรงงาน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --background-color: #f8f9fa;
            --text-color: #343a40;
            --border-color: #dee2e6;
            --card-background: #ffffff;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            padding: 20px;
            margin: 0;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .tab-container {
            display: flex;
            max-width: 650px;
            margin: 0 auto;
            border-bottom: 2px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 15px 10px;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            color: var(--secondary-color);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
            font-weight: 600;
        }

        .tab-btn:hover {
            color: var(--primary-color);
            background-color: rgba(0, 123, 255, 0.05);
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background: var(--card-background);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h2 {
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
            font-size: 14px;
        }

        input[type="text"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .input-icon-group {
            position: relative;
        }

        .input-icon-group input {
            padding-left: 40px;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 18px;
        }

        button[type="submit"] {
            background-color: var(--primary-color);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #0069d9;
        }

        button[type="submit"]:disabled {
            background-color: var(--secondary-color);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .form-panel {
            display: none;
            animation: fadeIn 0.4s;
        }

        .form-panel.active {
            display: block;
        }

        .preview-img {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
            border: 1px solid #ddd;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px;
            }

            .tab-btn {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <h1>🛠️ ระบบซ่อมบำรุงโรงงาน</h1>

    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('machinePanel', this)"><span>➕</span>
            เพิ่มเครื่องจักรใหม่</button>
        <button class="tab-btn" onclick="switchTab('logPanel', this)"><span>🛠️</span> บันทึกการซ่อม</button>
    </div>

    <div id="machinePanel" class="container form-panel active">
        <h2>➕ ลงทะเบียนเครื่องจักรใหม่</h2>
        <form id="machineForm">
            <div class="form-group">
                <label>รหัสเครื่องจักร (Machine ID):</label>
                <div class="input-icon-group">
                    <span class="input-icon">🆔</span>
                    <input type="text" id="mId" placeholder="เช่น CR-01" required>
                </div>
            </div>
            <div class="form-group">
                <label>ชื่อเครื่องจักร (Machine Name):</label>
                <div class="input-icon-group">
                    <span class="input-icon">⚙️</span>
                    <input type="text" id="mName" placeholder="เช่น เครื่องกลึง" required>
                </div>
            </div>
            <div class="form-group">
                <label>สถานที่ติดตั้ง (Location):</label>
                <div class="input-icon-group">
                    <span class="input-icon">📍</span>
                    <input type="text" id="mLoc" placeholder="เช่น ไลน์ผลิต A" required>
                </div>
            </div>
            <div class="form-group">
                <label>สถานะเริ่มต้น (Status):</label>
                <select id="mStatus">
                    <option value="พร้อมใช้งาน">🟢 พร้อมใช้งาน</option>
                    <option value="กำลังซ่อม">🔴 กำลังซ่อม</option>
                </select>
            </div>
            <button type="submit">บันทึกข้อมูลเครื่องจักร</button>
        </form>
    </div>

    <div id="logPanel" class="container form-panel">
        <h2>🛠️ บันทึกประวัติการซ่อมแซม</h2>
        <form id="logForm">
            <div class="form-group">
                <label>รหัสเครื่องจักร (Machine ID):</label>
                <div class="input-icon-group">
                    <span class="input-icon">🆔</span>
                    <input type="text" id="lMachineId" placeholder="เช่น CR-01" required>
                </div>
            </div>
            <div class="form-group">
                <label>รายละเอียดการซ่อม/อาการเสีย (Issue):</label>
                <textarea id="lIssue" rows="4" placeholder="ระบุอาการเสีย สาเหตุ และการแก้ไขที่ทำไป"
                    required></textarea>
            </div>
            <div class="form-group">
                <label>ชื่อช่างผู้ซ่อม (Technician):</label>
                <div class="input-icon-group">
                    <span class="input-icon">🔧</span>
                    <input type="text" id="lTech" placeholder="ชื่อช่างบำรุงรักษา" required>
                </div>
            </div>
            <div class="form-group">
                <label>สถานะงาน (Job Status):</label>
                <select id="lStatus">
                    <option value="เสร็จสิ้น">✅ เสร็จสิ้น</option>
                    <option value="รออะไหล่">⏳ รออะไหล่</option>
                </select>
            </div>
            <div class="form-group">
                <label>📸 ถ่ายรูปหรือแนบรูปภาพอาการเสีย:</label>
                <input type="file" id="lPhoto" accept="image/*" onchange="previewImage(this)">
                <img id="imgPreview" class="preview-img" alt="ตัวอย่างรูปภาพ">
            </div>
            <button type="submit">บันทึกประวัติการซ่อม</button>
        </form>
    </div>

    <script>
        // ใส่ลิงก์ Web App URL ของคุณเรียบร้อยแล้วครับ
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwfhvkwmE026SGBO5SPDIs_x9MJGNvioyAyPzvfi84fkjA2pU0TUU2jUi8bv6mKdTA5oQ/exec";

        let base64ImageString = "";

        function switchTab(panelId, btn) {
            document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            btn.classList.add('active');
        }

        function previewImage(input) {
            const preview = document.getElementById('imgPreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    base64ImageString = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            } else {
                preview.style.display = 'none';
                base64ImageString = "";
            }
        }

        document.getElementById('machineForm').addEventListener('submit', function (e) {
            e.preventDefault();
            sendData({
                formType: "machine",
                machineId: document.getElementById('mId').value,
                machineName: document.getElementById('mName').value,
                location: document.getElementById('mLoc').value,
                status: document.getElementById('mStatus').value
            }, 'machineForm');
        });

        document.getElementById('logForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const now = new Date();
            const logId = "LOG-" + now.getTime().toString().slice(-6);

            sendData({
                formType: "log",
                logId: logId,
                machineId: document.getElementById('lMachineId').value,
                date: now.toLocaleString('th-TH'),
                issue: document.getElementById('lIssue').value,
                technician: document.getElementById('lTech').value,
                jobStatus: document.getElementById('lStatus').value,
                imageFile: base64ImageString
            }, 'logForm');
        });

        function sendData(data, formId) {
            const btn = document.querySelector(`#${formId} button`);
            const originalBtnText = btn.innerText;
            btn.innerText = "กำลังบันทึกข้อมูลและอัปโหลดรูปภาพ...";
            btn.disabled = true;

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
                .then(() => {
                    const successMsg = document.createElement('div');
                    successMsg.innerText = "🎉 บันทึกสำเร็จเรียบร้อย!";
                    successMsg.style.cssText = "position:fixed;top:20px;right:20px;background:#28a745;color:white;padding:15px;border-radius:8px;z-index:1000;box-shadow:0 4px 8px rgba(0,0,0,0.2);font-weight:600;";
                    document.body.appendChild(successMsg);

                    setTimeout(() => {
                        successMsg.style.opacity = '0';
                        successMsg.style.transition = 'opacity 0.5s';
                        setTimeout(() => document.body.removeChild(successMsg), 500);
                    }, 3000);

                    document.getElementById(formId).reset();
                    if (formId === 'logForm') {
                        document.getElementById('imgPreview').style.display = 'none';
                        base64ImageString = "";
                    }
                })
                .catch(err => alert("เกิดข้อผิดพลาด: " + err))
                .finally(() => {
                    btn.innerText = originalBtnText;
                    btn.disabled = false;
                });
        }
    </script>

</body>

</html>
