<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบซ่อมบำรุงโรงงาน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --background-color: #f8f9fa;
            --text-color: #343a40;
            --border-color: #dee2e6;
            --card-background: #ffffff;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }

        /* ตกแต่งส่วนหัวข้อหลัก */
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* สไตล์สำหรับส่วนเลือกแท็บ */
        .tab-container {
            display: flex;
            max-width: 650px;
            margin: 0 auto;
            border-bottom: 2px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 15px 10px;
            cursor: pointer;
            background: none;
            border: none;
            outline: none;
            font-size: 16px;
            font-weight: 500;
            color: var(--secondary-color);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px; /* เว้นระยะไอคอนกับข้อความ */
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
            font-weight: 600;
        }

        .tab-btn:hover {
            color: var(--primary-color);
            background-color: rgba(0, 123, 255, 0.05);
        }

        /* Container หลักสำหรับฟอร์ม */
        .container {
            max-width: 650px;
            margin: 30px auto;
            background: var(--card-background);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); /* เงาจางๆ */
        }

        /* ตกแต่งหัวข้อในฟอร์ม */
        h2 {
            color: var(--text-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 20px;
        }

        /* สไตล์สำหรับ Form Group */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
            font-size: 14px;
        }

        /* สไตล์สำหรับ Input, Select, Textarea */
        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1); /* ไฮไลท์ตอนเลือก */
        }

        /* เพิ่มไอคอนเล็กๆ ใน input เพื่อให้ดูดีขึ้น */
        .input-icon-group {
            position: relative;
        }
        
        .input-icon-group input {
            padding-left: 40px; /* เว้นที่ด้านซ้าย */
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 18px;
        }

        /* ตกแต่งปุ่ม */
        button[type="submit"] {
            background-color: var(--primary-color);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #0069d9;
        }

        button[type="submit"]:active {
            transform: translateY(1px); /* เอฟเฟกต์ตอนกด */
        }

        button[type="submit"]:disabled {
            background-color: var(--secondary-color);
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* สไตล์สำหรับสถานะเสร็จสิ้น/รออะไหล่ */
        select#mStatus option[value="พร้อมใช้งาน"],
        select#lStatus option[value="เสร็จสิ้น"] {
            color: var(--success-color);
            font-weight: 500;
        }
        
        select#mStatus option[value="กำลังซ่อม"],
        select#lStatus option[value="รออะไหล่"] {
            color: #dc3545;
            font-weight: 500;
        }

        /* สำหรับการแสดงผลฟอร์ม */
        .form-panel {
            display: none;
            animation: fadeIn 0.4s; /* เอฟเฟกต์เฟดอิน */
        }

        .form-panel.active {
            display: block;
        }

        /* ฟังก์ชันอนิเมชั่นเฟดอิน */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ปรับปรุงให้เหมาะกับมือถือ */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px; border-radius: 8px; }
            .tab-btn { font-size: 14px; padding: 12px 5px; }
            h2 { font-size: 18px; }
        }
    </style>
</head>
<body>

<h1>🛠️ ระบบซ่อมบำรุงโรงงาน</h1>

<div class="tab-container">
    <button class="tab-btn active" onclick="switchTab('machinePanel', this)">
        <span>➕</span> เพิ่มเครื่องจักรใหม่
    </button>
    <button class="tab-btn" onclick="switchTab('logPanel', this)">
        <span>🛠️</span> บันทึกการซ่อม
    </button>
</div>

<div id="machinePanel" class="container form-panel active">
    <h2>➕ ลงทะเบียนเครื่องจักรใหม่</h2>
    <form id="machineForm">
        <div class="form-group">
            <label>รหัสเครื่องจักร (Machine ID):</label>
            <div class="input-icon-group">
                <span class="input-icon">🆔</span>
                <input type="text" id="mId" placeholder="เช่น CR-01" required>
            </div>
        </div>
        <div class="form-group">
            <label>ชื่อเครื่องจักร (Machine Name):</label>
            <div class="input-icon-group">
                <span class="input-icon">⚙️</span>
                <input type="text" id="mName" placeholder="เช่น เครื่องกลึง" required>
            </div>
        </div>
        <div class="form-group">
            <label>สถานที่ติดตั้ง (Location):</label>
            <div class="input-icon-group">
                <span class="input-icon">📍</span>
                <input type="text" id="mLoc" placeholder="เช่น ไลน์ผลิต A" required>
            </div>
        </div>
        <div class="form-group">
            <label>สถานะเริ่มต้น (Status):</label>
            <select id="mStatus">
                <option value="พร้อมใช้งาน">🟢 พร้อมใช้งาน</option>
                <option value="กำลังซ่อม">🔴 กำลังซ่อม</option>
            </select>
        </div>
        <button type="submit">บันทึกข้อมูลเครื่องจักร</button>
    </form>
</div>

<div id="logPanel" class="container form-panel">
    <h2>🛠️ บันทึกประวัติการซ่อมแซม</h2>
    <form id="logForm">
        <div class="form-group">
            <label>รหัสเครื่องจักร (Machine ID):</label>
            <div class="input-icon-group">
                <span class="input-icon">🆔</span>
                <input type="text" id="lMachineId" placeholder="เช่น CR-01" required>
            </div>
        </div>
        <div class="form-group">
            <label>รายละเอียดการซ่อม/อาการเสีย (Issue):</label>
            <textarea id="lIssue" rows="4" placeholder="ระบุอาการเสีย สาเหตุ และการแก้ไขที่ทำไป" required></textarea>
        </div>
        <div class="form-group">
            <label>ชื่อช่างผู้ซ่อม (Technician):</label>
            <div class="input-icon-group">
                <span class="input-icon">🔧</span>
                <input type="text" id="lTech" placeholder="ชื่อช่างบำรุงรักษา" required>
            </div>
        </div>
        <div class="form-group">
            <label>สถานะงาน (Job Status):</label>
            <select id="lStatus">
                <option value="เสร็จสิ้น">✅ เสร็จสิ้น</option>
                <option value="รออะไหล่">⏳ รออะไหล่</option>
            </select>
        </div>
        <button type="submit">บันทึกประวัติการซ่อม</button>
    </form>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwKINPSJLEKP727uJO8mpwFFntYJCW0aK9JGv2Ucnhg23NNSlxuHJT-L66MfB9MWa8GlQ/exec";

    // ฟังก์ชันสลับหน้าจอ ฟอร์ม
    function switchTab(panelId, btn) {
        document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(panelId).classList.add('active');
        btn.classList.add('active');
    }

    // ส่งข้อมูลฟอร์มเครื่องจักร
    document.getElementById('machineForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const data = {
            formType: "machine",
            machineId: document.getElementById('mId').value,
            machineName: document.getElementById('mName').value,
            location: document.getElementById('mLoc').value,
            status: document.getElementById('mStatus').value
        };
        sendData(data, 'machineForm');
    });

    // ส่งข้อมูลฟอร์มประวัติซ่อม
    document.getElementById('logForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const now = new Date();
        const data = {
            formType: "log",
            logId: "LOG-" + now.getTime().toString().slice(-6), // เจนรหัสสุ่มจากเวลา
            machineId: document.getElementById('lMachineId').value,
            date: now.toLocaleString('th-TH'),
            issue: document.getElementById('lIssue').value,
            technician: document.getElementById('lTech').value,
            jobStatus: document.getElementById('lStatus').value
        };
        sendData(data, 'logForm');
    });

    // ฟังก์ชันยิงข้อมูลไป Google Sheets
    function sendData(data, formId) {
        const btn = document.querySelector(`#${formId} button`);
        const originalBtnText = btn.innerText;
        btn.innerText = "กำลังบันทึกข้อมูล...";
        btn.disabled = true;

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', // จำเป็นสำหรับ Google Apps Script
            cache: 'no-cache',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(() => {
            // สร้างเอฟเฟกต์แจ้งเตือนแบบง่ายๆ
            const successMsg = document.createElement('div');
            successMsg.innerText = "🎉 บันทึกสำเร็จ!";
            successMsg.style.cssText = "position:fixed;top:20px;right:20px;background:#28a745;color:white;padding:15px;border-radius:8px;z-index:1000;box-shadow:0 4px 8px rgba(0,0,0,0.2);font-weight:600;";
            document.body.appendChild(successMsg);
            
            setTimeout(() => {
                successMsg.style.opacity = '0';
                successMsg.style.transition = 'opacity 0.5s';
                setTimeout(() => document.body.removeChild(successMsg), 500);
            }, 3000);

            document.getElementById(formId).reset();
        })
        .catch(err => alert("เกิดข้อผิดพลาด: " + err))
        .finally(() => {
            btn.innerText = originalBtnText;
            btn.disabled = false;
        });
    }
</script>

</body>
</html>
